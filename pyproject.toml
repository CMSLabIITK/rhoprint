[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhoprint"
version = "0.1.0"
description = "Physically interpretable descriptors extracted from VASP charge-density (CHGCAR) files, for materials-informatics and ML interpretability studies."
readme = "README.md"
license = "MIT"
authors = [
    { name = "CMS Lab, IIT Kanpur" },
]
requires-python = ">=3.9"
keywords = [
    "materials science",
    "DFT",
    "VASP",
    "CHGCAR",
    "charge density",
    "machine learning",
    "interpretability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "pymatgen>=2023.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/CMSLabIITK/rhoprint"
Repository = "https://github.com/CMSLabIITK/rhoprint"
Issues = "https://github.com/CMSLabIITK/rhoprint/issues"

[project.scripts]
rhoprint = "rhoprint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhoprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
